name: Java CI con Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas con Maven
        run: ./mvnw -B test

      - name: Generar resumen de pruebas en GitHub Actions
        if: always()
        run: |
          echo "### 📊 Resumen de Ejecución de Pruebas" >> $GITHUB_STEP_SUMMARY
          if [ -d "target/surefire-reports" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -h -E "FAILURE!|AssertionFailedError" target/surefire-reports/*.txt 2>/dev/null | head -n 15 >> $GITHUB_STEP_SUMMARY || echo "No se encontraron detalles de fallos." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Subir reportes de Surefire como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
