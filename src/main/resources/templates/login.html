<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JSK</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="card bg-white shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary">JSK</h1>
            <p class="text-gray-600 mt-2">Sistema de Gestión Comercial</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}" class="alert alert-error mb-4">
                <span>Credenciales incorrectas</span>
            </div>
            
            <div th:if="${param.logout}" class="alert alert-success mb-4">
                <span>Has cerrado sesión correctamente</span>
            </div>

            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text font-semibold">Usuario</span>
                </label>
                <input type="text" name="username" class="input input-bordered w-full" 
                       placeholder="Ingresa tu usuario" required>
            </div>

            <div class="form-control mb-6">
                <label class="label">
                    <span class="label-text font-semibold">Contraseña</span>
                </label>
                <input type="password" name="password" class="input input-bordered w-full" 
                       placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary w-full">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
