<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Admin - JSK</title>

    <link href="/css/output.css" rel="stylesheet">

    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Animación sidebar */
        .sidebar {
            transform: translateX(0);
            transition: transform .25s ease-in-out;
        }
        .sidebar.closed {
            transform: translateX(-100%);
        }

        /* Hover glow suave */
        .glow-hover:hover {
            box-shadow: 0 0 10px rgba(255,193,7,0.4);
            transition: .2s;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex">

<!-- Sidebar -->
<div id="sidebar" class="sidebar bg-yellow-600 text-white w-60 p-5 space-y-4 fixed h-full">
    <div class="text-xl font-bold flex items-center gap-2">
        <i data-lucide="shield"></i> Admin JSK
    </div>

    <nav class="flex flex-col gap-2">
        <a th:href="@{/admin/dashboard}" class="btn btn-ghost justify-start text-white glow-hover">
            <i data-lucide="layout-dashboard" class="w-4 h-4 mr-2"></i> Dashboard
        </a>

        <a th:href="@{/admin/coordinadores}" class="btn btn-ghost justify-start text-white glow-hover">
            <i data-lucide="users" class="w-4 h-4 mr-2"></i> Coordinadores
        </a>

        <a th:href="@{/admin/reportes}" class="btn btn-ghost justify-start text-white glow-hover">
            <i data-lucide="bar-chart-2" class="w-4 h-4 mr-2"></i> Reportes
        </a>

        <a th:href="@{/admin/config}" class="btn btn-ghost justify-start text-white glow-hover">
            <i data-lucide="settings" class="w-4 h-4 mr-2"></i> Configuración
        </a>
    </nav>

    <a th:href="@{/logout}" class="btn btn-warning w-full mt-6">
        <i data-lucide="log-out" class="w-4 h-4 mr-2"></i> Salir
    </a>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div class="flex-1 ml-60 p-6">

    <!-- Breadcrumb + Toggle sidebar -->
    <div class="flex items-center justify-between mb-6">
        <div class="breadcrumbs text-sm">
            <ul>
                <li><a th:href="@{/admin/dashboard}">Inicio</a></li>
                <li th:text="${breadcrumb}">Sección</li>
            </ul>
        </div>

        <button class="btn btn-sm" onclick="toggleSidebar()">
            <i data-lucide="menu" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Aquí entra el contenido -->
    <main th:insert="${content}"></main>

</div>

<script>
    // Iconos
    lucide.createIcons();

    // Toggle sidebar
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("closed");
    }
</script>

</body>
</html>
