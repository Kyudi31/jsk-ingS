<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Panel Impulsador</title>

    <link href="/css/output.css" rel="stylesheet">

    <!-- Animaciones + hover -->
    <style>
        .sidebar-slide {
            transition: transform .25s ease-in-out;
        }
        .nav-link:hover {
            background-color: rgba(99, 102, 241, 0.15);
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex">

<!-- ✅ Sidebar -->
<aside class="w-60 bg-indigo-700 text-white sidebar-slide">
    <div class="p-4 text-xl font-bold border-b border-indigo-600">
        Impulsador
    </div>

    <nav class="p-3 space-y-1">
        <a th:href="@{/impulsador/dashboard}" class="nav-link flex items-center gap-2 p-2 rounded-lg">
            📊 Dashboard
        </a>
        <a th:href="@{/impulsador/vendedores}" class="nav-link flex items-center gap-2 p-2 rounded-lg">
            👥 Vendedores
        </a>
        <a th:href="@{/impulsador/supervision-rutas}" class="nav-link flex items-center gap-2 p-2 rounded-lg">
            🛣️ Supervisar Rutas
        </a>
        <a th:href="@{/impulsador/ventas}" class="nav-link flex items-center gap-2 p-2 rounded-lg">
            💰 Ventas
        </a>
        <a th:href="@{/impulsador/objetivos}" class="nav-link flex items-center gap-2 p-2 rounded-lg">
            🎯 Objetivos
        </a>
    </nav>
</aside>

<!-- ✅ Contenido principal -->
<div class="flex-1">

    <!-- Header -->
    <header class="flex justify-between bg-white shadow px-6 py-4 items-center">
        <div>
            <h1 class="text-xl font-bold" th:text="${title}">Panel Impulsador</h1>
            <p class="text-sm text-gray-500" th:text="${breadcrumb}">Inicio</p>
        </div>

        <a th:href="@{/logout}" class="btn btn-error btn-sm">Salir</a>
    </header>

    <!-- Content container -->
    <main class="p-6" th:fragment="content"></main>
</div>

</body>
</html>
