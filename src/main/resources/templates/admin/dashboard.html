<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-theme="admin" style="color-scheme: light;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-base-100 min-h-screen">

<div class="navbar bg-primary text-primary-content shadow-lg">
    <div class="flex-1 px-2 mx-2 font-bold text-lg">
        Panel Admin - JSK
    </div>
    <div class="flex-none">
        <a th:href="@{/logout}" class="btn btn-warning btn-sm">Cerrar sesión</a>
    </div>
</div>

<div class="p-6">
    <h1 class="text-2xl font-bold mb-6 text-base-content">Bienvenido Administrador</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <a th:href="@{/admin/coordinadores}" class="card bg-base-100 shadow-xl hover:shadow-2xl border border-base-300 transition p-6 rounded-xl hover:-translate-y-1">
            <h2 class="font-semibold text-lg text-base-content">Gestionar Coordinadores</h2>
            <p class="text-base-content/70">Crear, ver y administrar coordinadores</p>
        </a>

        <a th:href="@{/admin/reportes}" class="card bg-base-100 shadow-xl hover:shadow-2xl border border-base-300 transition p-6 rounded-xl hover:-translate-y-1">
            <h2 class="font-semibold text-lg text-base-content">Reportes</h2>
            <p class="text-base-content/70">Estadísticas generales</p>
        </a>

        <a th:href="@{/admin/config}" class="card bg-base-100 shadow-xl hover:shadow-2xl border border-base-300 transition p-6 rounded-xl hover:-translate-y-1">
            <h2 class="font-semibold text-lg text-base-content">Configuraciones</h2>
            <p class="text-base-content/70">Configuración del sistema</p>
        </a>
    </div>
</div>
</body>
</html>
