<!DOCTYPE html>
<html data-theme="coordinador" class="bg-base-100" xmlns:th="http://www.thymeleaf.org" style="color-scheme: light;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Coordinador</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="bg-base-100 min-h-screen">
    <!-- Navbar -->
    <div class="navbar bg-primary text-primary-content shadow-lg">
        <div class="flex-1 px-2 mx-2 font-bold text-lg">
            Panel Coordinador - JSK
        </div>
        <div class="flex-none">
            <a th:href="@{/logout}" class="btn btn-warning btn-sm">Cerrar sesión</a>
        </div>
    </div>

    <div class="p-6">
        <h1 class="text-2xl font-bold mb-6">Bienvenido, Coordinador 👋</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Card Impulsadores -->
            <a th:href="@{/coordinador/impulsadores}" 
               class="card bg-base-100 shadow-xl hover:shadow-2xl border border-base-300 transition p-6 rounded-xl hover:-translate-y-1">
                <h2 class="font-semibold text-lg flex items-center gap-2">
                    <i data-lucide="users"></i> Gestionar Impulsadores
                </h2>
                <p class="text-gray-500">Crear y administrar impulsadores</p>
            </a>

            <!-- Card Rutas -->
            <a th:href="@{/coordinador/rutas}" 
               class="card bg-base-100 shadow-xl hover:shadow-2xl border border-base-300 transition p-6 rounded-xl hover:-translate-y-1">
                <h2 class="font-semibold text-lg flex items-center gap-2">
                    <i data-lucide="map"></i> Rutas
                </h2>
                <p class="text-gray-500">Creación y asignación de rutas</p>
            </a>

            <!-- Card Objetivos -->
            <a th:href="@{/coordinador/objetivos}" 
               class="card bg-base-100 shadow-xl hover:shadow-2xl border border-base-300 transition p-6 rounded-xl hover:-translate-y-1">
                <h2 class="font-semibold text-lg flex items-center gap-2">
                    <i data-lucide="target"></i> Metas del Mes
                </h2>
                <p class="text-gray-500">Asignar y visualizar objetivos</p>
            </a>
        </div>
    </div>

    <!-- Lucide Icons Loader -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
